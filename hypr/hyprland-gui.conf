# Generated by HyprMod


# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = __GL_VRR_ALLOWED,0
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

decoration:blur:enabled = false
decoration:shadow:enabled = false
general:allow_tearing = true
general:border_size = 2
general:col.active_border = 0xffffffff 45deg
general:gaps_in = 3
general:gaps_out = 6
general:layout = scrolling
general:resize_on_border = true
input:accel_profile = flat
input:repeat_delay = 300
input:repeat_rate = 40
master:mfact = 0.5
master:new_on_active = none
master:new_status = master
misc:disable_hyprland_logo = true
misc:force_default_wallpaper = 0
scrolling:focus_fit_method = 1

# Bezier curves
bezier = easeOutQuint, 0.23, 1.0, 0.32, 1.0

# Animations
animation = windows, 1, 4.79, easeOutQuint

# Monitors
monitor = HDMI-A-1, 1920x1080@239.96Hz, 0x0, 1, cm, srgb

# Keybinds
unbind = SUPER, A
unbind = SUPER, G
unbind = SUPER, B
unbind = SUPER, W
unbind = SUPER, H
unbind = SUPER SHIFT, Left
unbind = SUPER SHIFT, Up
unbind = SUPER SHIFT, Right
unbind = SUPER SHIFT, Down
unbind = SUPER, C
unbind = SUPER, grave
bind = SUPER, F, fullscreen, 0
bind = SUPER, G, pseudo
bind = SUPER, B, exec, zen-browser
bind = SUPER, W, exec, ~/.config/fuzzel/wallpaper.sh
bind = SUPER, H, execr, cd ~/Documents/hyprmod/ && uv run hyprmod
bind = SUPER SHIFT, Left, swapwindow, l
bind = SUPER SHIFT, Up, swapwindow, u
bind = SUPER SHIFT, Right, swapwindow, r
bind = SUPER SHIFT, Down, swapwindow, d
bind = SUPER, C, execr, ~/.config/hypr/UserScripts/smart-close.sh
bind = SUPER, grave, togglespecialworkspace, spotify
bind = SUPER, A, centerwindow
bind = CTRL, M, fullscreen, 1

# Window rules
windowrule = match:class ^(gamescope)$, fullscreen on
windowrule = match:title Picture-in-Picture, pin on
windowrule = match:title Picture-in-Picture, float on
windowrule = match:class cs2, immediate true
windowrule = match:class steam, match:title Friends List, float on
windowrule = match:class steam, match:title Steam Settings, float on
windowrule = match:class steam, match:title Counter-Strike 2, float on
windowrule = match:class steam, match:title Note*, float on
windowrule = match:class org.cachyos.scx-manager, float on

# Autostart
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper
